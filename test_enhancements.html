<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Enhancement Tests</title>
<style>
body{font-family:system-ui;padding:2rem;background:#0f1117;color:#e4e6eb;line-height:1.6}
.test-section{background:#1a1d27;border:1px solid #2a2d3a;border-radius:8px;padding:1.5rem;margin-bottom:1rem}
h1{color:#6366f1;margin-bottom:1rem}
h2{color:#22d3ee;font-size:1.2rem;margin-bottom:0.8rem}
.test-item{display:flex;align-items:center;gap:0.8rem;padding:0.5rem;border-left:3px solid #2a2d3a;margin:0.5rem 0}
.pass{border-left-color:#22c55e;background:rgba(34,197,94,0.1)}
.fail{border-left-color:#ef4444;background:rgba(239,68,68,0.1)}
.status{font-weight:700;min-width:60px}
.pass .status{color:#22c55e}
.fail .status{color:#ef4444}
button{background:#6366f1;color:#fff;border:none;padding:0.6rem 1.2rem;border-radius:6px;cursor:pointer;font-size:0.9rem}
button:hover{background:#5558e3}
.results{margin-top:1rem;padding:1rem;background:rgba(99,102,241,0.1);border-radius:6px}
</style>
</head>
<body>
<h1>🧪 Dashboard Enhancement Test Suite</h1>

<div class="test-section">
  <h2>File Existence Tests</h2>
  <div id="fileTests"></div>
</div>

<div class="test-section">
  <h2>Feature Validation Tests</h2>
  <div id="featureTests"></div>
</div>

<div class="test-section">
  <h2>Library Integration Tests</h2>
  <div id="libraryTests"></div>
</div>

<button onclick="runAllTests()">▶️ Run All Tests</button>

<div class="results" id="results" style="display:none"></div>

<script>
var testResults = [];

function addTestResult(section, name, passed, details) {
  testResults.push({section, name, passed, details});
  var container = document.getElementById(section + 'Tests');
  var div = document.createElement('div');
  div.className = 'test-item ' + (passed ? 'pass' : 'fail');
  div.innerHTML = '<span class="status">' + (passed ? '✓ PASS' : '✗ FAIL') + '</span>' +
    '<span>' + name + '</span>' +
    (details ? '<span style="margin-left:auto;font-size:0.85rem;color:#8b8fa3">' + details + '</span>' : '');
  container.appendChild(div);
}

async function runAllTests() {
  testResults = [];
  document.getElementById('fileTests').innerHTML = '';
  document.getElementById('featureTests').innerHTML = '';
  document.getElementById('libraryTests').innerHTML = '';
  
  // File existence tests
  await testFileExists('comparison_enhanced.html');
  await testFileExists('dashboard_enhanced.html');
  await testFileExists('ENHANCEMENTS.md');
  
  // Feature validation tests
  await testFileContains('comparison_enhanced.html', 'chartjs-plugin-zoom', 'Zoom plugin');
  await testFileContains('comparison_enhanced.html', 'exportChartData', 'Export function');
  await testFileContains('comparison_enhanced.html', 'dashboardEnhancements', 'Enhancement library');
  await testFileContains('comparison_enhanced.html', 'action-bar', 'Action bar');
  await testFileContains('dashboard_enhanced.html', 'exportDashboardData', 'Export function');
  await testFileContains('dashboard_enhanced.html', 'filterCommodityTable', 'Filter function');
  
  // Library integration tests
  await testFileContains('comparison_enhanced.html', 'Chart.register', 'Chart.js plugin registration');
  await testFileContains('comparison_enhanced.html', 'hammerjs', 'Hammer.js for touch');
  await testFileContains('dashboard_enhanced.html', 'Chart.defaults.plugins.zoom', 'Zoom configuration');
  
  // Show results
  var results = document.getElementById('results');
  var passed = testResults.filter(t => t.passed).length;
  var total = testResults.length;
  results.style.display = 'block';
  results.innerHTML = '<strong>Test Results:</strong> ' + passed + '/' + total + ' passed (' + 
    Math.round(passed/total*100) + '%)' +
    '<br><br><strong>Status:</strong> ' + (passed === total ? 
      '<span style="color:#22c55e">✓ All tests passed!</span>' : 
      '<span style="color:#ef4444">✗ Some tests failed</span>');
}

async function testFileExists(filename) {
  try {
    var response = await fetch(filename, {method: 'HEAD'});
    addTestResult('file', 'File exists: ' + filename, response.ok, response.status);
  } catch (e) {
    addTestResult('file', 'File exists: ' + filename, false, 'Network error');
  }
}

async function testFileContains(filename, searchString, testName) {
  try {
    var response = await fetch(filename);
    var text = await response.text();
    var found = text.includes(searchString);
    addTestResult('feature', testName + ' in ' + filename, found, 
      found ? 'Found' : 'Not found: ' + searchString);
  } catch (e) {
    addTestResult('feature', testName + ' in ' + filename, false, 'Cannot read file');
  }
}

// Auto-run tests on load
setTimeout(runAllTests, 500);
</script>
</body>
</html>
