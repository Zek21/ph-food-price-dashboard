<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI,Arial,sans-serif"><rect width="720" height="400" fill="#0d1117"/><text x="360.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">PyTorch on AMD RX 6600 (torch-directml): GPU speedup vs CPU</text><line x1="70" y1="330" x2="680" y2="330" stroke="#30363d"/><rect x="98.6" y="280.8" width="95.3" height="49.2" rx="4" fill="#f78166"/><text x="146.2" y="272.8" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">1.75x</text><text x="146.2" y="352.0" text-anchor="middle" font-size="13" fill="#9fb0c0">512x512</text><rect x="251.1" y="182.1" width="95.3" height="147.9" rx="4" fill="#3fb950"/><text x="298.8" y="174.1" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">5.26x</text><text x="298.8" y="352.0" text-anchor="middle" font-size="13" fill="#9fb0c0">1024x1024</text><rect x="403.6" y="103.9" width="95.3" height="226.1" rx="4" fill="#3fb950"/><text x="451.2" y="95.9" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">8.04x</text><text x="451.2" y="352.0" text-anchor="middle" font-size="13" fill="#9fb0c0">2048x2048</text><rect x="556.1" y="114.6" width="95.3" height="215.4" rx="4" fill="#3fb950"/><text x="603.8" y="106.6" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">7.66x</text><text x="603.8" y="352.0" text-anchor="middle" font-size="13" fill="#9fb0c0">4096x4096</text><text x="360.0" y="380" text-anchor="middle" font-size="12" fill="#7d8ea0">Square matmul, warmed; RX 6600 reaches ~2710 GFLOPS FP32. Higher is better.</text></svg>